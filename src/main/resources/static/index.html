<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TripMeyou</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <header class="tm-header">
    <h1 class="brand">TripMeyou</h1>
  </header>

  <main class="tm-main">
    <section class="tm-hero">
      <div class="hero-left">
        <div class="search-card">
          <h2>도시 · 나라 검색</h2>
          <form id="searchForm" class="search-form">
            <input id="q" type="text" placeholder="예) Tokyo, Japan / 파리, 프랑스" required />
            <button type="submit">검색</button>
          </form>

          <!-- 검색 후 탭 -->
          <div id="resultTabs" class="tabs" style="display:none;">
            <button class="tab-btn" data-target="attraction">관광지</button>
            <button class="tab-btn" data-target="hotel">숙박</button>
            <button class="tab-btn" data-target="weather">날씨</button>
            <button class="tab-btn" data-target="food">맛집</button>
            <button class="tab-btn" data-target="buddy">동행구하기</button>
            <button class="tab-btn" data-target="board">자유게시판</button>
          </div>

          <!-- 탭 컨텐츠 (샘플/플레이스홀더) -->
          <div id="tabContents" style="display:none;">
            <div id="attraction" class="tab-pane active"><p>선택한 지역의 관광지 정보(추후 구현)</p></div>
            <div id="hotel" class="tab-pane"><p>숙박 정보(추후 구현)</p></div>
            <div id="weather" class="tab-pane"><p>날씨 정보(추후 구현)</p></div>
            <div id="food" class="tab-pane"><p>맛집 정보(추후 구현)</p></div>
            <div id="buddy" class="tab-pane"><p>동행구하기(추후 구현)</p></div>
            <div id="board" class="tab-pane">
              <p>자유게시판으로 이동합니다.</p>
              <button id="goBoardBtn" class="ghost">자유게시판 보러가기</button>
            </div>
          </div>
        </div>

        <div class="map-card">
          <h3>세계 지도에서 선택</h3>
          <!-- 간단한 SVG 맵(플레이스홀더). 나중에 진짜 지도/라이브러리로 교체 가능 -->
          <div id="worldMap" class="map">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg" alt="world map" />
          </div>
          <small>지도를 클릭하면 해당 국가로 검색됩니다 (데모)</small>
        </div>
      </div>

      <aside class="hero-right">
        <div class="login-card">
          <h3>로그인</h3>
          <button id="goLogin" class="wide">로그인 하러 가기</button>
          <div class="login-links">
            <a href="#" id="goFindId">아이디 찾기</a>
            <span>|</span>
            <a href="#" id="goFindPw">비밀번호 찾기</a>
            <span>|</span>
            <a href="#" id="goSignup">회원가입</a>
          </div>
          <p class="muted">※ 로그인하지 않으면 글 보기/쓰기 불가</p>
        </div>
      </aside>
    </section>
  </main>

  <script src="/js/index.js"></script>
</body>
</html>

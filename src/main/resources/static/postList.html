<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>자유게시판</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-header">
    <h2>자유게시판</h2>
    <button id="goWrite" class="ghost">글쓰기</button>
  </div>

  <div id="postListContainer"></div>

  <script src="/js/logout.js"></script>
  <script src="/js/postList.js"></script>
  <script>
    fetch("/navbar.html").then(r=>r.text()).then(h => document.getElementById("navbar").innerHTML = h);

    // 글쓰기 버튼: 로그인 필요
    document.getElementById("goWrite").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/posts", { method: "GET" });
        if (res.status === 401) {
          alert("로그인 후 이용해주세요.");
          window.location.href = "/login.html";
          return;
        }
        window.location.href = "/makePost.html";
      } catch {
        alert("서버 연결을 확인해주세요.");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글쓰기</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <h2>글쓰기</h2>
  <form id="postForm">
    <input id="title" name="title" type="text" placeholder="제목" required>
    <textarea id="content" name="content" rows="8" placeholder="내용을 입력하세요" required></textarea>
    <button type="submit">등록</button>
  </form>

  <script src="/js/logout.js"></script>
  <script src="/js/post.js"></script>
  <script>
    fetch("/navbar.html").then(r=>r.text()).then(h => document.getElementById("navbar").innerHTML = h);
  </script>
</body>
</html>
